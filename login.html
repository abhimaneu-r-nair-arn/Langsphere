<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to LangSphere.">
  <title>LangSphere | Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-narrow">
    <a class="auth-home-link" href="index.html">LangSphere</a>
    <h1>Log in</h1>
    <p class="auth-intro">Continue where you left off in your learning route.</p>
    <div id="setup-notice" class="auth-setup-notice" role="status" hidden>
      Firebase is not configured. Add your project settings to <code>firebase.js</code>.
    </div>
    <form id="login-form" class="auth-form-single">
      <label for="li-email">Email</label>
      <input id="li-email" name="email" type="email" autocomplete="email" required>
      <label for="li-pass">Password</label>
      <input id="li-pass" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <a href="#" id="forgot">Forgot password?</a>
    </form>
    <p id="msg" class="auth-message" role="status" aria-live="polite"></p>
    <p class="auth-switch">New to LangSphere? <a href="signup.html">Create an account</a></p>
    <a class="auth-back-link" href="index.html">Back to LangSphere</a>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
