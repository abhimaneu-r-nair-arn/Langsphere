<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a LangSphere account.">
  <title>LangSphere | Sign up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-narrow">
    <a class="auth-home-link" href="index.html">LangSphere</a>
    <h1>Create account</h1>
    <p class="auth-intro">Save learning routes and build a personal language record.</p>
    <div id="setup-notice" class="auth-setup-notice" role="status" hidden>
      Firebase is not configured. Add your project settings to <code>firebase.js</code>.
    </div>
    <form id="signup-form" class="auth-form-single">
      <label for="su-name">Name</label>
      <input id="su-name" name="name" autocomplete="name" required>
      <label for="su-email">Email</label>
      <input id="su-email" name="email" type="email" autocomplete="email" required>
      <label for="su-pass">Password <span>(at least 6 characters)</span></label>
      <input id="su-pass" name="password" type="password" autocomplete="new-password" minlength="6" required>
      <button type="submit">Sign up</button>
    </form>
    <p id="msg" class="auth-message" role="status" aria-live="polite"></p>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    <a class="auth-back-link" href="index.html">Back to LangSphere</a>
  </main>
  <script type="module" src="signup.js"></script>
</body>
</html>
