<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a LangSphere account.">
  <title>LangSphere | Sign up</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='logoGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff9a2e'/%3E%3Cstop offset='50%25' stop-color='%23ff5a1f'/%3E%3Cstop offset='100%25' stop-color='%23ff2e2e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5' stroke='url(%23logoGrad)' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-narrow">
    <a class="auth-home-link logo-glow" href="index.html">LangSphere</a>
    <h1>Create account</h1>
    <p class="auth-intro">Save learning routes and build a personal language record.</p>
    <div id="setup-notice" class="auth-setup-notice" role="status" hidden>
      Firebase is not configured. Add your project settings to <code>firebase.js</code>.
    </div>
    <form id="signup-form" class="auth-form-single">
      <label for="su-name">Name</label>
      <input id="su-name" name="name" autocomplete="name" required>
      <label for="su-email">Email</label>
      <input id="su-email" name="email" type="email" autocomplete="email" required>
      <label for="su-pass">Password <span>(at least 6 characters)</span></label>
      <div class="password-field">
        <input id="su-pass" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="password-toggle" type="button" data-password-toggle aria-controls="su-pass"
          aria-label="Show password" title="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="bulb-glass" d="M12 2a7 7 0 0 0-4 12.75c.83.57 1.5 1.52 1.5 2.25h5c0-.73.67-1.68 1.5-2.25A7 7 0 0 0 12 2z"/>
            <path d="M9 18h6m-5 3h4"/>
            <path d="M12 5a4 4 0 0 0-4 4M12 1v1M4.2 4.2l.7.7M1 11h1m18 0h1m-1.9-6.8-.7.7"/>
          </svg>
        </button>
      </div>
      <button type="submit">Sign up</button>
    </form>
    <p id="msg" class="auth-message" role="status" aria-live="polite"></p>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    <a class="auth-back-link" href="index.html">Back to LangSphere</a>
  </main>
  <script src="password-toggle.js" defer></script>
  <script type="module" src="signup.js"></script>
</body>
</html>
